<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Galería de Monstruos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo">
                <span class="logo-text">Monstruos</span>
                <span class="logo-subtext">S.A.</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="inicio.html" class="active">Inicio</a>
            <a href="contacto.html">Contacto</a>
            <a href="index.html">Ver a Mike-ish</a>
        </nav>
    </header>

    <main>
        <h1 class="main-title" style="text-align: center; margin-top: 40px; color: var(--secondary-blue); font-family: 'Bangers', cursive; font-size: 3.5rem;">Galería de Monstruos</h1>
        <div class="monster-gallery">
            <!-- Monstruo 1 -->
            <div class="gallery-item">
                <div class="monster-placeholder blue"></div>
                <h3>Grog el Azul</h3>
                <p>Especialista en burbujas.</p>
            </div>
            <!-- Monstruo 2 -->
            <div class="gallery-item">
                <div class="monster-placeholder red"></div>
                <h3>Fuego Loco</h3>
                <p>El más caliente del pantano.</p>
            </div>
            <!-- Monstruo 3 -->
            <div class="gallery-item">
                <div class="monster-placeholder purple"></div>
                <h3>Sombra Misteriosa</h3>
                <p>Invisible los martes.</p>
            </div>
            <!-- Monstruo 4 -->
            <div class="gallery-item">
                <div class="monster-placeholder orange"></div>
                <h3>Diente Rayado</h3>
                <p>Amante de los cepillos gigantes.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Monstruos S.A. - Creado por un Programador Junior</p>
